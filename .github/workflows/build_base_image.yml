name: Build base image
on:
  workflow_dispatch:

env:
  DHUBU: ${{secrets.DHUBU}}
  DHUBP: ${{secrets.DHUBP}}
  MAINNET_SOLANA_URL: ${{secrets.MAINNET_SOLANA_URL}}
  DOCKERHUB_ORG_NAME: ${{vars.DOCKERHUB_ORG_NAME}}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-base-image:
    runs-on: ["gha-runner-scale-set-large"]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run:  pip install -r ./.github/workflows/requirements.txt
      - name: Specify image tags
        run: |
          python3 ./.github/workflows/deploy.py specify_image_tags \
          --git_ref=${{ github.ref }} \
          --git_head_ref=${{ github.head_ref }} \
          --git_base_ref=${{ github.base_ref }}
      - name: Set outputs
        id: tags
        run: |
          echo "evm_sha_tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - name: Build docker base image
        run: |
          python3 ./.github/workflows/deploy.py build_base_docker_image \
          --evm_sha_tag=${{ steps.tags.outputs.evm_sha_tag }}
      - name: Finalize image
        run: |
          python3 ./.github/workflows/deploy.py finalize_base_image \
          --evm_sha_tag=${{ steps.tags.outputs.evm_sha_tag }}
