version: "2.1"

services:
  solana:
    image: ${EVM_LOADER_IMAGE}
    environment:
      - SOLANA_URL=http://127.0.0.1:8899
      - CI=true
    hostname: solana
    ports:
      - "8899"
    expose:
      - "8899"
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    volumes:
      - /home/artem/devel/com/neon/core/neon-evm/evm_loader/target/deploy/evm_loader.so:/opt/evm_loader.so
      - /home/artem/devel/com/neon/core/neon-evm/evm_loader/target/deploy/evm_loader-testnet.so:/opt/evm_loader-testnet.so
      - /home/artem/devel/com/neon/core/neon-evm/evm_loader/target/deploy/evm_loader-rollup.so:/opt/evm_loader-rollup.so
      - /home/artem/devel/com/neon/core/neon-evm/evm_loader/target/deploy/evm_loader-mainnet.so:/opt/evm_loader-mainnet.so
      - /home/artem/devel/com/neon/core/neon-evm/evm_loader/target/deploy/evm_loader-govertest.so:/opt/evm_loader-govertest.so
      - /home/artem/devel/com/neon/core/neon-evm/evm_loader/target/deploy/evm_loader-devnet.so:/opt/evm_loader-devnet.so
      - /home/artem/devel/com/neon/core/neon-evm/evm_loader/target/release/neon-cli:/opt/neon-cli
      - /home/artem/devel/com/neon/core/neon-evm/evm_loader/target/release/neon-api:/opt/neon-api
      - /home/artem/devel/com/neon/core/neon-evm/evm_loader/target/release/neon-rpc:/opt/neon-rpc
      - /home/artem/devel/com/neon/core/neon-evm/evm_loader/target/release/libneon_lib.so:/opt/libs/current/libneon_lib.so
#      - /home/artem/devel/com/neon/core/neon-evm/evm_loader/target/deploy:/opt
    entrypoint:
      /opt/solana-run-neon.sh
    networks:
      - net

  neon-core-api:
    restart: unless-stopped
    hostname: neon_api
    entrypoint:
      /opt/neon-api -H 0.0.0.0:8085
    environment:
      RUST_BACKTRACE: 1
      RUST_LOG: debug
      NEON_API_LISTENER_ADDR: 0.0.0.0:8085
      SOLANA_URL: http://solana:8899
      EVM_LOADER: 53DfF883gyixYNXnM7s5xhdeyV8mVk9T4i2hGV9vG9io
      # operator-keypairs/id.json
      SOLANA_KEY_FOR_CONFIG: BMp6gEnveANdvSvspESJUrNczuHz1GF5UQKjVLCkAZih
      COMMITMENT: confirmed
      NEON_DB_CLICKHOUSE_URLS: "http://45.250.253.36:8123;http://45.250.253.38:8123"
      TRACER_DB_TYPE: clickhouse
    image: ${EVM_LOADER_IMAGE}
    ports:
    - "8085"
    expose:
    - "8085"
    networks:
      - net

  neon-core-rpc:
    restart: unless-stopped
    hostname: neon_core_rpc
    entrypoint: /opt/neon-rpc /opt/libs/current
    environment:
      RUST_BACKTRACE: full
      RUST_LOG: neon=debug
      NEON_API_LISTENER_ADDR: 0.0.0.0:3100
      SOLANA_URL: http://solana:8899
      EVM_LOADER: 53DfF883gyixYNXnM7s5xhdeyV8mVk9T4i2hGV9vG9io
      NEON_TOKEN_MINT: HPsV9Deocecw3GeZv1FkAPNCBRfuVyfw9MMwjwRe1xaU
      NEON_CHAIN_ID: 111
      COMMITMENT: confirmed
      NEON_DB_CLICKHOUSE_URLS: "http://45.250.253.36:8123;http://45.250.253.38:8123"
      TRACER_DB_TYPE: clickhouse
      NEON_DB_INDEXER_HOST: 45.250.253.32
      NEON_DB_INDEXER_PORT: 5432
      NEON_DB_INDEXER_DATABASE: indexer
      NEON_DB_INDEXER_USER: postgres
      NEON_DB_INDEXER_PASSWORD: "vUlpDyAP0gA98R5Bu"
      KEYPAIR: /opt/operator-keypairs/id.json
      FEEPAIR: /opt/operator-keypairs/id.json
      SOLANA_KEY_FOR_CONFIG: BMp6gEnveANdvSvspESJUrNczuHz1GF5UQKjVLCkAZih

    image: ${EVM_LOADER_IMAGE}
    ports:
      - "3100"
    expose:
      - "3100"
    networks:
      - net

  tests:
    image: ${NEON_TESTS_IMAGE}
    environment:
      - SOLANA_URL=http://solana:8899
      - NEON_CORE_API_URL=http://neon_api:8085/api
      - NEON_CORE_API_RPC_URL=http://neon_core_rpc:3100
    hostname: tests
    command: sleep infinity
    networks:
      - net
    ports:
      - "35956:35956"
#    volumes:
#      - /home/artem/devel/com/neon/core/neon-tests/contracts/precompiled/CallSolanaCaller.sol:/opt/neon-tests/contracts/precompiled/CallSolanaCaller.sol
#      - /home/artem/devel/com/neon/core/neon-tests/integration/tests/neon_evm/utils/call_solana.py:/opt/neon-tests/integration/tests/neon_evm/utils/call_solana.py
#      - /home/artem/devel/com/neon/core/neon-tests/integration/tests/neon_evm/test_interoperability.py:/opt/neon-tests/integration/tests/neon_evm/test_interoperability.py

networks:
  net:
